<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#071B36" />
      <stop offset="100%" stop-color="#0b2447" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA43B" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d264a" />
      <stop offset="100%" stop-color="#051224" />
    </linearGradient>
    <pattern id="mathGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F28C18" stroke-width="0.5" stroke-opacity="0.15" />
      <circle cx="20" cy="20" r="1" fill="#F28C18" fill-opacity="0.2" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)" rx="24" />
  <rect width="600" height="750" fill="url(#mathGrid)" rx="24" />

  <!-- Subtle Mathematical Curves and Coordinate axes -->
  <g opacity="0.25">
    <!-- Parabola -->
    <path d="M 50 650 Q 300 200 550 650" fill="none" stroke="#F28C18" stroke-width="1.5" stroke-dasharray="4,4" />
    <!-- Sine wave -->
    <path d="M 0 375 Q 150 250 300 375 T 600 375" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />
    <!-- Coordinate system -->
    <line x1="300" y1="50" x2="300" y2="700" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="50" y1="375" x2="550" y2="375" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.2" />
  </g>

  <!-- Mathematical Formulas Floating -->
  <g font-family="'Inter', 'Courier New', monospace" font-size="14" fill="#F28C18" opacity="0.4" font-weight="600">
    <text x="50" y="100">f(x) = ax² + bx + c</text>
    <text x="440" y="140">x² + y² = r²</text>
    <text x="60" y="240">∫ f(x)dx</text>
    <text x="460" y="320">Σ xᵢ = μ</text>
    <text x="70" y="480">lim (x→∞)</text>
    <text x="430" y="550">Δ = b² - 4ac</text>
  </g>

  <!-- Concentric Rings & Glow Behind Portrait Silhouette -->
  <circle cx="300" cy="310" r="190" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,6" />
  <circle cx="300" cy="310" r="155" fill="#0b2447" fill-opacity="0.6" stroke="#F28C18" stroke-width="2" />
  <circle cx="300" cy="310" r="145" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />

  <!-- Professional Portrait Silhouette / Avatar -->
  <g id="portrait-silhouette">
    <!-- Academic Halo / Accent -->
    <circle cx="300" cy="235" r="75" fill="#F4F6F8" fill-opacity="0.95" />
    
    <!-- Hair / Head Contour -->
    <path d="M 235 230 C 235 170, 260 145, 300 145 C 340 145, 365 170, 365 230 C 365 260, 350 280, 300 280 C 250 280, 235 260, 235 230 Z" fill="#071B36" />
    
    <!-- Face / Beard / Modern styling profile -->
    <path d="M 245 220 C 245 180, 265 160, 300 160 C 335 160, 355 180, 355 220 C 355 260, 340 285, 300 285 C 260 285, 245 260, 245 220 Z" fill="#E8D5C4" />
    <!-- Styled modern hair -->
    <path d="M 245 200 C 245 160, 270 140, 300 140 C 330 140, 355 160, 355 195 C 350 185, 335 175, 300 175 C 265 175, 250 185, 245 200 Z" fill="#0a1728" />
    <!-- Neat beard & mustache silhouette -->
    <path d="M 260 235 C 270 255, 285 268, 300 268 C 315 268, 330 255, 340 235 C 335 275, 320 285, 300 285 C 280 285, 265 275, 260 235 Z" fill="#0a1728" />

    <!-- Neck & Collar -->
    <path d="M 280 275 L 320 275 L 325 320 L 275 320 Z" fill="#E8D5C4" />
    <polygon points="280,295 300,340 320,295 310,290 300,305 290,290" fill="#FFFFFF" />
    <!-- Tie / Orange Accent -->
    <polygon points="296,310 304,310 308,390 300,410 292,390" fill="url(#orangeGrad)" />

    <!-- Suit & Shoulders -->
    <path d="M 140 470 C 150 360, 210 325, 275 320 L 300 375 L 325 320 C 390 325, 450 360, 460 470 C 465 520, 465 580, 465 600 L 135 600 C 135 580, 135 520, 140 470 Z" fill="url(#suitGrad)" stroke="#F28C18" stroke-width="1.5" stroke-opacity="0.3" />
    <!-- Lapels -->
    <path d="M 210 345 L 285 430 L 265 435 L 195 365 Z" fill="#071b36" />
    <path d="M 390 345 L 315 430 L 335 435 L 405 365 Z" fill="#071b36" />
  </g>

  <!-- Professional Badge Over Frame -->
  <g transform="translate(100, 590)">
    <rect width="400" height="110" rx="16" fill="#071B36" fill-opacity="0.9" stroke="url(#orangeGrad)" stroke-width="2" filter="url(#glow)" />
    <!-- Academic Monogram / Icon -->
    <circle cx="55" cy="55" r="32" fill="url(#orangeGrad)" />
    <text x="55" y="64" font-family="'Cairo', 'Inter', sans-serif" font-size="24" font-weight="900" fill="#071B36" text-anchor="middle">ME</text>

    <!-- Name & Title text -->
    <text x="105" y="44" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Mohamed Elhussieni</text>
    <text x="105" y="68" font-family="'Cairo', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#F28C18">Mathematics Teacher – Egypt | معلم رياضيات</text>
    <text x="105" y="90" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" fill="#93a8c3">"تبسيط • فهم • تميز"</text>
  </g>

  <!-- Border Accent -->
  <rect x="10" y="10" width="580" height="730" rx="20" fill="none" stroke="url(#orangeGrad)" stroke-width="2" stroke-opacity="0.7" />
  <!-- Corner Tech Crosses -->
  <g stroke="#F28C18" stroke-width="2">
    <line x1="25" y1="20" x2="25" y2="36" />
    <line x1="17" y1="28" x2="33" y2="28" />
    <line x1="575" y1="20" x2="575" y2="36" />
    <line x1="567" y1="28" x2="583" y2="28" />
    <line x1="25" y1="714" x2="25" y2="730" />
    <line x1="17" y1="722" x2="33" y2="722" />
    <line x1="575" y1="714" x2="575" y2="730" />
    <line x1="567" y1="722" x2="583" y2="722" />
  </g>
</svg>
