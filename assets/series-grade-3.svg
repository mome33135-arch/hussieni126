<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 960" width="100%" height="100%">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b15" />
      <stop offset="50%" stop-color="#071B36" />
      <stop offset="100%" stop-color="#0e3264" />
    </linearGradient>
    <linearGradient id="g3Orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE42" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <linearGradient id="g3Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <pattern id="g3Grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#F28C18" stroke-width="0.5" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="0.75" fill="#F9D423" fill-opacity="0.2" />
    </pattern>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="700" height="960" fill="url(#g3Bg)" rx="16" />
  <rect width="700" height="960" fill="url(#g3Grid)" rx="16" />

  <!-- Geometric & Analytical Geometry Elements -->
  <g opacity="0.35">
    <!-- Circle with tangent and central angle -->
    <circle cx="200" cy="650" r="110" fill="none" stroke="#F28C18" stroke-width="2" />
    <line x1="90" y1="760" x2="310" y2="760" stroke="#F9D423" stroke-width="2.5" />
    <line x1="200" y1="650" x2="200" y2="760" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3" />
    
    <!-- 3D Coordinate Plane / Vector Lines -->
    <path d="M 450 380 L 630 380 M 540 280 L 540 480 M 470 440 L 610 320" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 480 340 L 600 420" stroke="#F28C18" stroke-width="2.5" />
  </g>

  <!-- Floating Formulas -->
  <g font-family="'Courier New', monospace" font-size="17" fill="#F28C18" opacity="0.5" font-weight="bold">
    <text x="50" y="240">sin² θ + cos² θ = 1</text>
    <text x="60" y="280">m = (y₂ - y₁) / (x₂ - x₁)</text>
    <text x="470" y="220">y = mx + c</text>
    <text x="480" y="700">d = √[(x₂-x₁)² + (y₂-y₁)²]</text>
    <text x="50" y="870">V = (4/3)πr³</text>
  </g>

  <!-- Top Series Header Badge -->
  <g transform="translate(50, 45)">
    <rect width="600" height="90" rx="18" fill="#050B14" fill-opacity="0.85" stroke="url(#g3Orange)" stroke-width="1.5" />
    <text x="300" y="40" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">سلسلة الحسيني في الرياضيات</text>
    <text x="300" y="70" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F28C18" text-anchor="middle" letter-spacing="3">ALHUSSIENI MATHEMATICS SERIES • 2026</text>
  </g>

  <!-- Grade Title Display (Centerpiece) -->
  <g transform="translate(60, 260)">
    <!-- Glow Box -->
    <rect width="580" height="230" rx="20" fill="#071B36" fill-opacity="0.94" stroke="url(#g3Gold)" stroke-width="3.5" filter="url(#shadow3)" />
    <rect x="15" y="15" width="550" height="200" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Grade Tag with Gold Accent -->
    <rect x="160" y="-18" width="260" height="36" rx="18" fill="url(#g3Gold)" />
    <text x="290" y="6" font-family="'Cairo', sans-serif" font-size="17" font-weight="800" fill="#071B36" text-anchor="middle">الشهادة الإعدادية</text>

    <!-- Main Grade Text -->
    <text x="290" y="95" font-family="'Cairo', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">الصف الثالث الإعدادي</text>
    <text x="290" y="135" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#F28C18" text-anchor="middle" letter-spacing="1">THIRD PREPARATORY GRADE</text>

    <!-- Subjects included -->
    <line x1="100" y1="160" x2="480" y2="160" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <text x="290" y="190" font-family="'Cairo', sans-serif" font-size="18" font-weight="700" fill="#F4F6F8" text-anchor="middle">حساب المثلثات والهندسة التحليلية • الجبر والإحصاء</text>
  </g>

  <!-- Educational Identity Tagline Box -->
  <g transform="translate(130, 530)">
    <rect width="440" height="65" rx="32" fill="#050B14" stroke="url(#g3Gold)" stroke-width="2" />
    <text x="220" y="42" font-family="'Cairo', sans-serif" font-size="26" font-weight="900" fill="#F9D423" text-anchor="middle" letter-spacing="2">تبسيط  •  فهم  •  تميز</text>
  </g>

  <!-- Feature Bullet Badges -->
  <g transform="translate(70, 640)" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    <g transform="translate(0, 0)">
      <rect width="170" height="48" rx="10" fill="#0e3264" stroke="#F9D423" stroke-width="1" />
      <text x="85" y="30" text-anchor="middle">تأهيل الامتحانات النهائية</text>
    </g>
    <g transform="translate(195, 0)">
      <rect width="170" height="48" rx="10" fill="#0e3264" stroke="#F9D423" stroke-width="1" />
      <text x="85" y="30" text-anchor="middle">مستويات تفكير عليا</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="170" height="48" rx="10" fill="#0e3264" stroke="#F9D423" stroke-width="1" />
      <text x="85" y="30" text-anchor="middle">نماذج استرشادية شاملة</text>
    </g>
  </g>

  <!-- Author & Bottom Bar -->
  <g transform="translate(50, 770)">
    <rect width="600" height="135" rx="16" fill="url(#g3Gold)" filter="url(#shadow3)" />
    <rect x="6" y="6" width="588" height="123" rx="12" fill="#071B36" />
    
    <text x="300" y="45" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#F4F6F8" text-anchor="middle">إعداد وتأليف</text>
    <text x="300" y="85" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">أ. محمد الحسيني</text>
    <text x="300" y="112" font-family="'Inter', 'Cairo', sans-serif" font-size="15" font-weight="700" fill="#F28C18" text-anchor="middle">Mohamed Elhussieni • معلم رياضيات</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="14" y="14" width="672" height="932" rx="14" fill="none" stroke="url(#g3Gold)" stroke-width="2.5" stroke-opacity="0.8" />
</svg>
