<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 960" width="100%" height="100%">
  <defs>
    <linearGradient id="g2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1B" />
      <stop offset="50%" stop-color="#071B36" />
      <stop offset="100%" stop-color="#0a254c" />
    </linearGradient>
    <linearGradient id="g2Orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA834" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <linearGradient id="g2Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <pattern id="g2Grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F28C18" stroke-width="0.5" stroke-opacity="0.1" />
      <circle cx="16" cy="16" r="0.75" fill="#F28C18" fill-opacity="0.15" />
    </pattern>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="700" height="960" fill="url(#g2Bg)" rx="16" />
  <rect width="700" height="960" fill="url(#g2Grid)" rx="16" />

  <!-- Geometric & Mathematical Art Elements -->
  <g opacity="0.3">
    <!-- Right Triangle (Pythagorean) with squares -->
    <polygon points="120,680 320,680 320,520" fill="none" stroke="#F28C18" stroke-width="2.5" />
    <rect x="300" y="660" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Square on hypotenuse outline -->
    <path d="M 120 680 L 280 480 L 480 640 L 320 680 Z" fill="none" stroke="#F9D423" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Concentric Target Circles -->
    <circle cx="560" cy="240" r="160" fill="none" stroke="url(#g2Orange)" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="560" cy="240" r="110" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="560" cy="240" r="60" fill="#F28C18" fill-opacity="0.15" />
  </g>

  <!-- Floating Formulas -->
  <g font-family="'Courier New', monospace" font-size="17" fill="#F28C18" opacity="0.45" font-weight="bold">
    <text x="50" y="240">√2 ≈ 1.4142...</text>
    <text x="60" y="280">a² + b² = c²</text>
    <text x="470" y="440">f(x) = mx + c</text>
    <text x="490" y="720">∛x = y ⇔ y³ = x</text>
    <text x="520" y="870">S = 4πr²</text>
  </g>

  <!-- Top Series Header Badge -->
  <g transform="translate(50, 45)">
    <rect width="600" height="90" rx="18" fill="#050B14" fill-opacity="0.85" stroke="url(#g2Orange)" stroke-width="1.5" />
    <text x="300" y="40" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">سلسلة الحسيني في الرياضيات</text>
    <text x="300" y="70" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F28C18" text-anchor="middle" letter-spacing="3">ALHUSSIENI MATHEMATICS SERIES • 2026</text>
  </g>

  <!-- Grade Title Display (Centerpiece) -->
  <g transform="translate(60, 260)">
    <!-- Glow Box -->
    <rect width="580" height="230" rx="20" fill="#071B36" fill-opacity="0.92" stroke="url(#g2Orange)" stroke-width="3" filter="url(#shadow2)" />
    <rect x="15" y="15" width="550" height="200" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Grade Tag -->
    <rect x="180" y="-18" width="220" height="36" rx="18" fill="url(#g2Orange)" />
    <text x="290" y="6" font-family="'Cairo', sans-serif" font-size="17" font-weight="800" fill="#071B36" text-anchor="middle">المرحلة الإعدادية</text>

    <!-- Main Grade Text -->
    <text x="290" y="95" font-family="'Cairo', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">الصف الثاني الإعدادي</text>
    <text x="290" y="135" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#F28C18" text-anchor="middle" letter-spacing="1">SECOND PREPARATORY GRADE</text>

    <!-- Subjects included -->
    <line x1="100" y1="160" x2="480" y2="160" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <text x="290" y="190" font-family="'Cairo', sans-serif" font-size="18" font-weight="700" fill="#F4F6F8" text-anchor="middle">الأعداد الحقيقية والعمليات عليها • نظريات المثلث والتشابه</text>
  </g>

  <!-- Educational Identity Tagline Box -->
  <g transform="translate(130, 530)">
    <rect width="440" height="65" rx="32" fill="#050B14" stroke="url(#g2Gold)" stroke-width="1.8" />
    <text x="220" y="42" font-family="'Cairo', sans-serif" font-size="26" font-weight="900" fill="#F9D423" text-anchor="middle" letter-spacing="2">تبسيط  •  فهم  •  تميز</text>
  </g>

  <!-- Feature Bullet Badges -->
  <g transform="translate(70, 640)" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    <g transform="translate(0, 0)">
      <rect width="170" height="48" rx="10" fill="#0a254c" stroke="#F28C18" stroke-width="1" />
      <text x="85" y="30" text-anchor="middle">تطبيقات برهان منظمة</text>
    </g>
    <g transform="translate(195, 0)">
      <rect width="170" height="48" rx="10" fill="#0a254c" stroke="#F28C18" stroke-width="1" />
      <text x="85" y="30" text-anchor="middle">بنك أسئلة واختبارات</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="170" height="48" rx="10" fill="#0a254c" stroke="#F28C18" stroke-width="1" />
      <text x="85" y="30" text-anchor="middle">خرائط ذهنية للمفاهيم</text>
    </g>
  </g>

  <!-- Author & Bottom Bar -->
  <g transform="translate(50, 770)">
    <rect width="600" height="135" rx="16" fill="url(#g2Orange)" filter="url(#shadow2)" />
    <rect x="6" y="6" width="588" height="123" rx="12" fill="#071B36" />
    
    <text x="300" y="45" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#F4F6F8" text-anchor="middle">إعداد وتأليف</text>
    <text x="300" y="85" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">أ. محمد الحسيني</text>
    <text x="300" y="112" font-family="'Inter', 'Cairo', sans-serif" font-size="15" font-weight="700" fill="#F28C18" text-anchor="middle">Mohamed Elhussieni • معلم رياضيات</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="14" y="14" width="672" height="932" rx="14" fill="none" stroke="url(#g2Orange)" stroke-width="2.5" stroke-opacity="0.8" />
</svg>
